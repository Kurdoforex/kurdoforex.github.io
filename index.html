<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SYED SIBGHATULLAH</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
font-family:Arial,Helvetica,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
}

:root{
--pink:#ff2f92;
--purple:#8b3dff;
--blue:#20bfff;
--green:#22c76b;
--yellow:#ffd21f;
--red:#ff3158;
--card:#101010;
--border:rgba(255,255,255,.12);
}

/* NAV */
nav{
position:fixed;
top:0;
left:0;
width:100%;
z-index:1000;
background:rgba(0,0,0,.75);
backdrop-filter:blur(18px);
border-bottom:1px solid var(--border);
}

.nav{
width:94%;
max-width:1500px;
margin:auto;
min-height:75px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.logo{
font-size:20px;
font-weight:900;
letter-spacing:3px;
white-space:nowrap;
background:linear-gradient(
90deg,
#ff3158,
#ff9d00,
#ffd21f,
#22c76b,
#20bfff,
#8b3dff,
#ff2f92
);
-webkit-background-clip:text;
color:transparent;
}

.links{
display:flex;
gap:5px;
overflow-x:auto;
scrollbar-width:none;
}

.links::-webkit-scrollbar{display:none}

.links a{
white-space:nowrap;
padding:10px 14px;
border-radius:8px;
font-size:12px;
font-weight:bold;
color:#bbb;
transition:.2s;
}

.links a:hover{
color:#fff;
background:rgba(255,255,255,.1);
}

/* HERO */
.hero{
min-height:100vh;
padding:130px 5% 80px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
overflow:hidden;
background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.88)
),
url("https://commons.wikimedia.org/wiki/Special:FilePath/Gay_Pride_flag_of_Pakistan.png")
center/cover;
}

.hero::before{
content:"";
position:absolute;
width:650px;
height:650px;
border-radius:50%;
background:conic-gradient(
#ff3158,
#ff9d00,
#ffd21f,
#22c76b,
#20bfff,
#8b3dff,
#ff3158
);
filter:blur(100px);
opacity:.28;
animation:spin 16s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.hero-content{
position:relative;
z-index:2;
width:100%;
max-width:1200px;
}

.hero h1{
font-size:clamp(50px,9vw,125px);
line-height:.9;
letter-spacing:-5px;
background:linear-gradient(
90deg,
#ff3158,
#ff9d00,
#ffd21f,
#22c76b,
#20bfff,
#8b3dff
);
-webkit-background-clip:text;
color:transparent;
}

.hero img{
width:min(1000px,95%);
height:430px;
object-fit:cover;
margin:45px auto 0;
border-radius:24px;
border:1px solid rgba(255,255,255,.2);
box-shadow:0 30px 100px rgba(0,0,0,.7);
}

/* SECTIONS */
section{
padding:110px 4%;
}

.container{
width:92%;
max-width:1500px;
margin:auto;
}

.title{
font-size:clamp(42px,7vw,90px);
text-align:center;
margin-bottom:45px;
letter-spacing:-4px;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}

.gallery-card{
height:350px;
border-radius:18px;
overflow:hidden;
border:1px solid var(--border);
background:#111;
position:relative;
}

.gallery-card.big{
grid-column:span 2;
grid-row:span 2;
height:718px;
}

.gallery-card img{
width:100%;
height:100%;
object-fit:cover;
transition:.6s;
}

.gallery-card:hover img{
transform:scale(1.07);
}

.gallery-card::after{
content:"SYED SIBGHATULLAH";
position:absolute;
bottom:18px;
left:20px;
font-weight:900;
letter-spacing:2px;
font-size:15px;
text-shadow:0 3px 15px #000;
}

/* PEOPLE */
.people{
background:
radial-gradient(
circle at center,
rgba(139,61,255,.16),
transparent 55%
);
}

.people-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
}

.person{
height:540px;
border-radius:22px;
overflow:hidden;
border:1px solid var(--border);
position:relative;
background:#111;
}

.person img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}

.person:hover img{
transform:scale(1.06);
}

.person::after{
content:"SYED SIBGHATULLAH";
position:absolute;
bottom:20px;
left:22px;
font-size:18px;
font-weight:900;
letter-spacing:2px;
text-shadow:0 3px 18px #000;
}

/* FLAGS */
.flags{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.flag{
height:250px;
border-radius:20px;
overflow:hidden;
border:1px solid var(--border);
background:#111;
}

.flag img{
width:100%;
height:100%;
object-fit:cover;
}

/* BIG BRAND */
.brand{
min-height:75vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
overflow:hidden;
}

.brand::before{
content:"";
position:absolute;
width:100%;
height:10px;
background:linear-gradient(
90deg,
#ff3158,
#ff9d00,
#ffd21f,
#22c76b,
#20bfff,
#8b3dff,
#ff2f92
);
filter:blur(18px);
}

.brand h2{
position:relative;
font-size:clamp(55px,12vw,180px);
line-height:.9;
letter-spacing:-6px;
background:linear-gradient(
90deg,
#ff3158,
#ff9d00,
#ffd21f,
#22c76b,
#20bfff,
#8b3dff,
#ff2f92
);
-webkit-background-clip:text;
color:transparent;
}

/* FOOTER */
footer{
padding:70px 20px;
text-align:center;
background:#020202;
border-top:1px solid var(--border);
}

.footer-logo{
font-size:clamp(35px,7vw,75px);
font-weight:900;
letter-spacing:4px;
background:linear-gradient(
90deg,
#ff3158,
#ff9d00,
#ffd21f,
#22c76b,
#20bfff,
#8b3dff
);
-webkit-background-clip:text;
color:transparent;
}

/* MOBILE */
@media(max-width:900px){

.gallery{
grid-template-columns:1fr 1fr;
}

.gallery-card.big{
grid-column:span 2;
height:500px;
}

.people-grid{
grid-template-columns:1fr 1fr;
}

.flags{
grid-template-columns:1fr 1fr;
}
}

@media(max-width:600px){

.nav{
display:block;
padding:12px 0;
}

.logo{
text-align:center;
margin-bottom:8px;
}

.hero{
padding-top:145px;
}

.hero h1{
letter-spacing:-3px;
}

.hero img{
height:280px;
}

section{
padding:75px 4%;
}

.gallery{
grid-template-columns:1fr;
}

.gallery-card,
.gallery-card.big{
grid-column:span 1;
grid-row:span 1;
height:350px;
}

.people-grid,
.flags{
grid-template-columns:1fr;
}

.person{
height:430px;
}

.flag{
height:220px;
}
}
</style>
</head>
