<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALAZ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* RAINBOW BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,0,80,.22),transparent 28%),
        radial-gradient(circle at 85% 20%,rgba(0,170,255,.22),transparent 28%),
        radial-gradient(circle at 50% 90%,rgba(150,0,255,.20),transparent 30%),
        #050505;
}

/* NAV */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    padding:16px 4%;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.12);
}

.navbar{
    max-width:1500px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:1000;
    letter-spacing:7px;
    white-space:nowrap;
    background:linear-gradient(
        90deg,
        #ff1744,
        #ff9100,
        #ffee00,
        #00d95f,
        #00bfff,
        #8b35ff
    );
    -webkit-background-clip:text;
    color:transparent;
}

.nav-links{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
}

.nav-links::-webkit-scrollbar{
    display:none;
}

.nav-links a{
    min-width:max-content;
    padding:10px 16px;
    border-radius:10px;
    color:white;
    font-size:13px;
    font-weight:bold;
    transition:.25s;
}

.nav-links a:hover{
    background:linear-gradient(
        90deg,
        #ff1744,
        #ff9100,
        #00d95f,
        #00bfff,
        #8b35ff
    );
    transform:translateY(-2px);
}

/* HERO */
.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:120px 5% 80px;
    text-align:center;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    border-radius:50%;
    background:conic-gradient(
        #ff1744,
        #ff9100,
        #ffee00,
        #00d95f,
        #00bfff,
        #8b35ff,
        #ff1744
    );
    filter:blur(90px);
    opacity:.23;
    animation:rotate 15s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero h1{
    font-size:clamp(90px,18vw,230px);
    line-height:.8;
    letter-spacing:-10px;
    background:linear-gradient(
        90deg,
        #ff1744,
        #ff9100,
        #ffee00,
        #00d95f,
        #00bfff,
        #8b35ff
    );
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 0 60px rgba(255,255,255,.08);
}

.hero-sub{
    margin-top:35px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.flag{
    width:70px;
    height:44px;
    border-radius:7px;
    box-shadow:0 8px 25px rgba(0,0,0,.4);
    object-fit:cover;
}

.rainbow{
    background:linear-gradient(
        to bottom,
        #e40303 0 16.6%,
        #ff8c00 16.6% 33.2%,
        #ffed00 33.2% 49.8%,
        #008026 49.8% 66.4%,
        #004dff 66.4% 83%,
        #750787 83% 100%
    );
}

.progress{
    background:
        linear-gradient(
            to bottom,
            #e40303 0 14%,
            #ff8c00 14% 28%,
            #ffed00 28% 42%,
            #008026 42% 56%,
            #004dff 56% 70%,
            #750787 70% 84%,
            #111 84% 100%
        );
}

.hero-photo{
    margin:45px auto 0;
    width:min(1100px,95%);
    height:430px;
    object-fit:cover;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
        0 0 0 3px rgba(255,255,255,.02),
        0 30px 100px rgba(0,0,0,.7);
}

/* SECTIONS */
section{
    padding:110px 4%;
}

.section{
    max-width:1500px;
    margin:auto;
}

.section-title{
    text-align:center;
    font-size:clamp(45px,7vw,90px);
    margin-bottom:45px;
    letter-spacing:-3px;
}

/* IMAGE GRID */
.gallery{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    height:360px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.12);
    background:#111;
}

.card.large{
    grid-column:span 2;
    grid-row:span 2;
    height:738px;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.6s;
}

.card:hover img{
    transform:scale(1.08);
}

.card::after{
    content:"ALAZ";
    position:absolute;
    left:20px;
    bottom:17px;
    font-size:22px;
    font-weight:1000;
    letter-spacing:5px;
    text-shadow:0 3px 15px black;
}

/* PEOPLE */
.people-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.people-card{
    height:500px;
    overflow:hidden;
    border-radius:22px;
    position:relative;
    border:1px solid rgba(255,255,255,.12);
}

.people-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.6s;
}

.people-card:hover img{
    transform:scale(1.06);
}

.people-card::after{
    content:"ALAZ";
    position:absolute;
    bottom:20px;
    left:25px;
    font-size:28px;
    font-weight:1000;
    letter-spacing:6px;
    text-shadow:0 3px 20px #000;
}

/* GIANT BRAND */
.brand{
    min-height:75vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.brand::before{
    content:"";
    position:absolute;
    width:100%;
    height:10px;
    top:50%;
    transform:translateY(-50%);
    background:linear-gradient(
        90deg,
        #ff1744,
        #ff9100,
        #ffee00,
        #00d95f,
        #00bfff,
        #8b35ff
    );
    filter:blur(20px);
}

.brand h2{
    position:relative;
    font-size:clamp(80px,18vw,240px);
    letter-spacing:-10px;
    background:linear-gradient(
        90deg,
        #ff1744,
        #ff9100,
        #ffee00,
        #00d95f,
        #00bfff,
        #8b35ff
    );
    -webkit-background-clip:text;
    color:transparent;
}

/* FLAG WALL */
.flag-wall{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:15px;
}

.flag-box{
    height:180px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    position:relative;
}

.flag-box::after{
    content:"ALAZ";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:1000;
    letter-spacing:5px;
    color:white;
    text-shadow:0 3px 15px #000;
    background:rgba(0,0,0,.12);
}

/* COLORS */
.c1{background:linear-gradient(#ff0018 0 16%,#ff8a00 16% 33%,#ffe600 33% 50%,#00bd3b 50% 66%,#0099ff 66% 83%,#7715c9 83%)}
.c2{background:linear-gradient(135deg,#ff1744,#ff9100,#ffee00,#00d95f,#00bfff,#8b35ff)}
.c3{background:linear-gradient(135deg,#ff00a8,#7500ff,#00d9ff,#00ff8c,#ffee00,#ff5e00)}
.c4{background:linear-gradient(45deg,#ff003c,#ff8a00,#ffee00,#00d95f,#008cff,#7b00ff)}
.c5{background:linear-gradient(90deg,#ff004c,#ff6b00,#ffe600,#00e676,#00b8ff,#651fff)}
.c6{background:linear-gradient(135deg,#ff1744 0 25%,#ff9100 25% 45%,#00d95f 45% 65%,#00bfff 65% 82%,#8b35ff 82%)}

/* FOOTER */
footer{
    padding:80px 20px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.1);
    background:#020202;
}

.footer-logo{
    font-size:70px;
    font-weight:1000;
    letter-spacing:8px;
    background:linear-gradient(
        90deg,
        #ff1744,
        #ff9100,
        #ffee00,
        #00d95f,
        #00bfff,
        #8b35ff
    );
    -webkit-background-clip:text;
    color:transparent;
}

/* MOBILE */
@media(max-width:900px){

    .gallery{
        grid-template-columns:1fr 1fr;
    }

    .card.large{
        grid-column:span 2;
        height:500px;
    }

    .people-grid{
        grid-template-columns:1fr 1fr;
    }

    .flag-wall{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:600px){

    nav{
        padding:12px 3%;
    }

    .navbar{
        display:block;
    }

    .logo{
        text-align:center;
        margin-bottom:10px;
    }

    .nav-links{
        padding-bottom:3px;
    }

    .hero{
        padding-top:150px;
    }

    .hero h1{
        letter-spacing:-5px;
    }

    .hero-photo{
        height:280px;
    }

    section{
        padding:75px 4%;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .card,
    .card.large{
        grid-column:span 1;
        grid-row:span 1;
        height:330px;
    }

    .people-grid{
        grid-template-columns:1fr;
    }

    .people-card{
        height:420px;
    }

    .flag-wall{
        grid-template-columns:1fr 1fr;
    }

    .flag-box{
        height:140px;
    }

    .footer-logo{
        font-size:55px;
    }
}
</style>
</head>
