<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Virale TikTok 2026</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 2rem; text-align: center; }
        h1 { color: #ff0050; text-shadow: 0 0 20px #ff0050; }
        .container { max-width: 700px; margin: 0 auto; }
        .box { background: linear-gradient(145deg, #1a1a1a, #222); border-radius: 30px; padding: 2.5rem; margin: 2rem auto; box-shadow: 0 10px 40px rgba(255,0,80,0.2); }
        .btn { background: linear-gradient(135deg, #ff0050, #ff7a00); color: #fff; border: none; padding: 1.2rem 3rem; border-radius: 60px; font-size: 1.4rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #ff0050; }
        .output { margin-top: 2rem; font-size: 1.2rem; line-height: 1.8; }
        .badge { background: #ff0050; color: #fff; padding: 0.3rem 1rem; border-radius: 30px; display: inline-block; margin: 0.3rem; }
        .hashtag { color: #00d4ff; }
        .trending { color: #ffd700; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 GENERATORE VIRALE TIKTOK 2026 🔥</h1>
        <p class="trending">Basato su algoritmi reali e trend del 2026, testa di cazzo.</p>
        <div class="box">
            <button class="btn" onclick="generaVideoVirale()">🎬 GENERA VIDEO VIRALE</button>
            <div class="output" id="output">
                <p>Clicca il pulsante, pezzo di merda, e scopri cosa postare per diventare famoso.</p>
            </div>
        </div>
    </div>

    <script>
        function generaVideoVirale() {
            // DATABASE DI MERDA PER ANDARE VIRALE NEL 2026
            const trend = {
                format: [
                    "POV: {situazione}",
                    "React a {video}",
                    "Stitching {creator}",
                    "Duetto con {creator}",
                    "Montaggio epico di {tema}",
                    "Tutorial veloce su {argomento}",
                    "Storytime drammatico: {storia}",
                    "Challenge: {challenge}",
                    "Green screen con {immagine}",
                    "ASMR di {oggetto}"
                ],
                situazione: [
                    "quando la tua ex ti scrive alle 3 di notte",
                    "quando il prof ti chiama alla lavagna e non hai studiato",
                    "quando scopri che il tuo cane è più famoso di te",
                    "quando il WiFi cade durante una live",
                    "quando il tuo capo ti chiede di lavorare nel weekend",
                    "quando realizzi che hai 0 follower dopo 3 anni"
                ],
                video: [
                    "un video di un gatto che balla",
                    "un trend dance che hai visto 500 volte",
                    "un video di un tizio che cade dalle scale",
                    "un filmato di cibo che sembra porno",
                    "un video motivazionale di merda"
                ],
                creator: [
                    "@khaby.lame (ma fai schifo a confronto)",
                    "@bella.porco (perché sei patetico)",
                    "@therock (sì, come no)",
                    "@charlidamelio (ma non sei lei, idiota)"
                ],
                tema: [
                    "fallimenti epici",
                    "momenti da dimenticare",
                    "trasformazioni da schifo",
                    "reazioni esagerate",
                    "cringe compilation"
                ],
                argomento: [
                    "come fingere di lavorare",
                    "come fare il caffè come un barista (ma fai cagare)",
                    "come evitare le persone al supermercato",
                    "come sembrare intelligente senza esserlo"
                ],
                storia: [
                    "il giorno in cui ho mandato un messaggio alla persona sbagliata",
                    "quando ho tentato di fare il trend e mi sono rotto il culo",
                    "la volta che ho fatto un video virale per sbaglio",
                    "quando ho scoperto che la mia ragazza seguiva più cani che me"
                ],
                challenge: [
                    "prova a non ridere (fallirai, come sempre)",
                    "mangia qualcosa di piccante e piangi",
                    "balla per 10 secondi e sembra un epilettico",
                    "fai 10 flessioni e muori"
                ],
                immagine: [
                    "un panda che fa surf",
                    "un alieno che balla la salsa",
                    "una scimmia che guida una macchina",
                    "un gatto con gli occhiali da sole"
                ],
                oggetto: [
                    "un foglio di carta che si accartoccia",
                    "una bolla di sapone che scoppia",
                    "un cubetto di ghiaccio che si scioglie",
                    "un telefono che vibra"
                ]
            };

            // Hashtag virali 2026
            const hashtagPool = [
                "#fyp", "#foryou", "#viral", "#trend", "#2026", "#tiktok2026",
                "#perte", "#virale", "#imparacontiktok", "#tutorial",
                "#commedia", "#fail", "#momentoepico", "#trasformazione",
                "#cringe", "#pov", "#challenge", "#storytime"
            ];

            // Scegli un formato a caso
            const formato = trend.format[Math.floor(Math.random() * trend.format.length)];

            // Sostituisci i placeholder nel formato
            let descrizione = formato;
            for (let key in trend) {
                if (key !== 'format') {
                    const regex = new RegExp(`\\{${key}\\}`, 'g');
                    if (descrizione.match(regex)) {
                        const valore = trend[key][Math.floor(Math.random() * trend[key].length)];
                        descrizione = descrizione.replace(regex, valore);
                    }
                }
            }

            // Genera 3-5 hashtag a caso
            const numHashtag = Math.floor(Math.random() * 3) + 3;
            let hashtag = '';
            for (let i = 0; i < numHashtag; i++) {
                const h = hashtagPool[Math.floor(Math.random() * hashtagPool.length)];
                if (!hashtag.includes(h)) {
                    hashtag += h + ' ';
                }
            }

            // Durata consigliata
            const durata = Math.floor(Math.random() * 30) + 15; // 15-45 secondi

            // Momento migliore per postare (basato su 2026)
            const ore = ["07:00", "09:30", "12:00", "15:00", "18:30", "21:00"];
            const orario = ore[Math.floor(Math.random() * ore.length)];

            // Output
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = `
                <div style="background: #111; border-radius: 20px; padding: 1.5rem; margin-top: 1rem;">
                    <h2 style="color: #ff0050;">🎬 VIDEO DA POSTARE:</h2>
                    <p style="font-size: 1.6rem; font-weight: bold; margin: 1rem 0;">${descrizione}</p>
                    <hr style="border-color: #333;">
                    <p><strong>⏱ Durata consigliata:</strong> ${durata} secondi</p>
                    <p><strong>🕐 Orario migliore:</strong> ${orario} UTC</p>
                    <p><strong>🏷 Hashtag:</strong> <span class="hashtag">${hashtag.trim()}</span></p>
                    <p style="margin-top: 1rem; color: #888;">💡 <em>Consiglio da professionista: se non diventi virale con questo, sei semplicemente un fallito.</em></p>
                </div>
            `;
        }
    </script>
</body>
</html>
